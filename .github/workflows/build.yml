name: 打包 Windows 安装程序

on:
  push:
    branches: [ "main" ]  # 当你 push 到 main 分支时触发

jobs:
  build:
    runs-on: windows-latest  # 必须在 Windows 环境下打包

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 使用 PyInstaller 生成可执行文件
      run: |
        # --noconsole: 不显示黑色命令行窗口
        # --add-data: 将你的模块文件夹全部打包进去 (Windows下使用分号 ;)
        pyinstaller --noconsole --name "园林景观智能设计平台" `
        --add-data "modules;modules" `
        --add-data "core;core" `
        --add-data "ui;ui" `
        --add-data "data;data" `
        --collect-all PyQt6 `
        --clean `
        main.py

    - name: 使用 Inno Setup 制作安装包
      uses: Gabriel-Oatley/Inno-Setup-Action@v1.2.2
      with:
        filepath: build_installer.iss  # 我们在下一步创建这个脚本

    - name: 上传安装包到 GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 园林设计平台-安装包
        path: Output/*.exe