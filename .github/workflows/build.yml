name: 打包 Windows 安装程序

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 watchdog numpy networkx pandas
        pip install pyinstaller

    - name: 使用 PyInstaller 生成可执行文件
      run: |
        # 这里的 --add-data 语法在 Windows 终端需要用分号 ;
        pyinstaller --noconsole --name "园林景观智能设计平台" `
        --add-data "modules;modules" `
        --add-data "core;core" `
        --add-data "ui;ui" `
        --add-data "data;data" `
        --collect-all PyQt6 `
        --clean `
        main.py

    - name: 安装 Inno Setup 引擎
      uses: MinGK/setup-innosetup@v3

    - name: 编译安装向导 (.exe)
      run: iscc build_installer.iss

    - name: 上传安装包到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 园林设计平台-安装包
        path: Output/*.exe