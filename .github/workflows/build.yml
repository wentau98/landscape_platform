name: 打包 Windows 安装程序

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Python 依赖
      run: |
        python -m pip install --upgrade pip
        # 安装你项目里用到的所有库
        pip install PyQt6 watchdog numpy networkx pandas pyinstaller

    - name: 使用 PyInstaller 生成可执行文件
      run: |
        # 使用 powershell 的换行符 `
        pyinstaller --noconsole --name "园林景观智能设计平台" `
        --add-data "modules;modules" `
        --add-data "core;core" `
        --add-data "ui;ui" `
        --add-data "data;data" `
        --collect-all PyQt6 `
        --clean `
        main.py

    - name: 使用内置 Inno Setup 编译安装包
      shell: pwsh
      run: |
        # GitHub Windows 镜像自带 ISCC 编译器，直接调用即可
        & "iscc" build_installer.iss

    - name: 上传安装包到 GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 园林设计平台-Windows安装包
        path: Output/*.exe